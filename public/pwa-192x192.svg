<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="50%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="192" height="192" rx="36" fill="url(#bgGrad)"/>
  <rect width="184" height="184" x="4" y="4" rx="32" fill="none" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Left Tile (Red 7) -->
  <g filter="url(#shadow)" transform="translate(32, 34)">
    <rect width="64" height="100" rx="10" fill="url(#tileGrad)" stroke="#d97706" stroke-width="2"/>
    <circle cx="12" cy="14" r="4" fill="#ef4444"/>
    <text x="32" y="68" font-family="system-ui, sans-serif" font-weight="900" font-size="44" fill="#dc2626" text-anchor="middle">7</text>
    <rect x="8" y="86" width="48" height="4" rx="2" fill="#78350f" opacity="0.3"/>
  </g>

  <!-- Right Tile (Blue 8) -->
  <g filter="url(#shadow)" transform="translate(96, 56)">
    <rect width="64" height="100" rx="10" fill="url(#tileGrad)" stroke="#d97706" stroke-width="2"/>
    <circle cx="12" cy="14" r="4" fill="#3b82f6"/>
    <text x="32" y="68" font-family="system-ui, sans-serif" font-weight="900" font-size="44" fill="#2563eb" text-anchor="middle">8</text>
    <rect x="8" y="86" width="48" height="4" rx="2" fill="#78350f" opacity="0.3"/>
  </g>

  <!-- Star Sparkle Accent -->
  <path d="M96 20 L100 28 L108 32 L100 36 L96 44 L92 36 L84 32 L92 28 Z" fill="#fbbf24"/>
</svg>
