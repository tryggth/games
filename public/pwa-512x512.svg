<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="tileGrad512" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="50%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <filter id="shadow512" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad512)"/>
  <rect width="496" height="496" x="8" y="8" rx="88" fill="none" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="4"/>

  <!-- Left Tile (Red 7) -->
  <g filter="url(#shadow512)" transform="translate(86, 92)">
    <rect width="170" height="270" rx="24" fill="url(#tileGrad512)" stroke="#d97706" stroke-width="5"/>
    <circle cx="32" cy="36" r="10" fill="#ef4444"/>
    <text x="85" y="185" font-family="system-ui, sans-serif" font-weight="900" font-size="120" fill="#dc2626" text-anchor="middle">7</text>
    <rect x="20" y="235" width="130" height="10" rx="5" fill="#78350f" opacity="0.3"/>
  </g>

  <!-- Right Tile (Blue 8) -->
  <g filter="url(#shadow512)" transform="translate(256, 150)">
    <rect width="170" height="270" rx="24" fill="url(#tileGrad512)" stroke="#d97706" stroke-width="5"/>
    <circle cx="32" cy="36" r="10" fill="#3b82f6"/>
    <text x="85" y="185" font-family="system-ui, sans-serif" font-weight="900" font-size="120" fill="#2563eb" text-anchor="middle">8</text>
    <rect x="20" y="235" width="130" height="10" rx="5" fill="#78350f" opacity="0.3"/>
  </g>

  <!-- Star Sparkle Accent -->
  <path d="M256 50 L266 72 L290 82 L266 92 L256 114 L246 92 L222 82 L246 72 Z" fill="#fbbf24"/>
</svg>
